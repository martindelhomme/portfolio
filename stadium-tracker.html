<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Sports Stadium Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
  --text:#f0f2ff;--text-mid:#8b90b0;--text-dim:#4a4f6a;
  --nba:#f97316;--nfl:#3b82f6;--nhl:#ef4444;--mlb:#22c55e;
  --visited-glow:rgba(255,255,255,0.15);
  --font-display:'Inter',system-ui,sans-serif;
}
html,body{height:100%;font-family:var(--font-display);background:var(--bg);color:var(--text);overflow-x:hidden;}
/* HEADER */
.header{padding:20px 28px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{font-size:24px;}
.logo-text{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text);}
.logo-sub{font-size:11px;color:var(--text-mid);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
.header-actions{display:flex;gap:8px;}
.btn-sm{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text-mid);transition:all .15s;}
.btn-sm:hover{border-color:var(--text-mid);color:var(--text);}
.btn-sm.danger:hover{border-color:#ef4444;color:#ef4444;}

/* STATS STRIP */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);margin:18px 28px;border-radius:8px;overflow:hidden;}
.stat-card{background:var(--surface);padding:16px 20px;text-align:center;}
.stat-num{font-size:28px;font-weight:800;color:var(--text);line-height:1;margin-bottom:4px;}
.stat-num span{font-size:16px;font-weight:400;color:var(--text-mid);}
.stat-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mid);}

/* FILTERS */
.controls{padding:0 28px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.filter-btn{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:7px 16px;border-radius:20px;cursor:pointer;border:2px solid transparent;background:var(--surface2);color:var(--text-mid);transition:all .18s;}
.filter-btn[data-sport="NBA"].active{background:var(--nba);color:#fff;border-color:var(--nba);}
.filter-btn[data-sport="NFL"].active{background:var(--nfl);color:#fff;border-color:var(--nfl);}
.filter-btn[data-sport="NHL"].active{background:var(--nhl);color:#fff;border-color:var(--nhl);}
.filter-btn[data-sport="MLB"].active{background:var(--mlb);color:#fff;border-color:var(--mlb);}
.filter-btn:hover:not(.active){border-color:var(--text-dim);color:var(--text);}
.filter-sep{width:1px;height:24px;background:var(--border);}
.toggle-visited{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-mid);transition:all .15s;}
.toggle-visited.active{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,.1);}
.btn-fit{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-mid);transition:all .15s;}
.btn-fit:hover{border-color:var(--text-mid);color:var(--text);}

/* SEARCH */
.search-wrap{padding:0 28px 14px;position:relative;}
.search-input{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px 10px 38px;border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--text-dim);}
.search-icon{position:absolute;left:42px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px;pointer-events:none;}
.search-results{position:absolute;top:calc(100% - 2px);left:28px;width:420px;max-width:calc(100vw - 56px);background:var(--surface2);border:1px solid var(--border);border-radius:0 0 8px 8px;z-index:2000;max-height:280px;overflow-y:auto;display:none;}
.search-results.open{display:block;}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--surface);}
.sr-venue{font-size:13px;font-weight:600;color:var(--text);}
.sr-teams{font-size:11px;color:var(--text-mid);margin-top:2px;}
.sr-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;margin-right:4px;letter-spacing:.04em;}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 300px;gap:0;height:calc(100vh - 260px);min-height:420px;margin:0 28px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
#map{height:100%;z-index:1;}

/* SIDEBAR */
.sidebar{background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;}
.sidebar-section{padding:16px;border-bottom:1px solid var(--border);}
.sidebar-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mid);margin-bottom:12px;}
/* Team list */
.sport-group{margin-bottom:12px;}
.sport-group-header{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 0;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.sport-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.team-item{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:5px;user-select:none;transition:background .1s;}
.team-item:hover{background:var(--surface2);}
.team-name{font-size:12px;color:var(--text-mid);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.team-item.any-selected .team-name{color:var(--text);}
.team-checks{display:flex;gap:5px;flex-shrink:0;}
/* Each checkbox: stadium or seen */
.chk{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:all .15s;position:relative;}
.chk:hover{border-color:var(--text-dim);}
.chk.visited{background:#6366f1;border-color:#6366f1;color:#fff;}
.chk.seen{background:#f59e0b;border-color:#f59e0b;color:#fff;}
/* Sidebar column headers */
.team-list-header{display:flex;align-items:center;padding:0 6px 8px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.tlh-name{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);flex:1;}
.tlh-checks{display:flex;gap:5px;flex-shrink:0;}
.tlh-label{width:20px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);}
/* Status dot on team item */
.team-status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--border);}
.team-status-dot.both{background:#22c55e;}
.team-status-dot.seen-only{background:#f59e0b;}
.team-status-dot.visited-only{background:#6366f1;}
/* Progress section with two bars */
.progress-sub-label{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px;margin-top:4px;}
.progress-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.progress-bar-row .progress-bar{flex:1;}
.progress-bar-row .pb-count{font-size:9px;color:var(--text-dim);width:28px;text-align:right;flex-shrink:0;}

/* PROGRESS BARS */
.progress-sport{margin-bottom:12px;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
.progress-name{font-weight:600;}
.progress-count{color:var(--text-mid);}
.progress-bar{height:4px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;}

/* VENUE LIST */
.venue-table-wrap{padding:0 28px 28px;margin-top:18px;}
.venue-table-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;}
.venue-table{width:100%;border-collapse:collapse;font-size:12px;}
.venue-table th{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-mid);padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;background:var(--surface);position:sticky;top:0;}
.venue-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text-mid);}
.venue-table td:first-child{font-weight:600;color:var(--text);}
.venue-table tbody tr:hover td{background:var(--surface);}
.sport-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.05em;}

/* LEAFLET OVERRIDES */
.leaflet-popup-content-wrapper{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:0;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.leaflet-popup-content{margin:0;padding:14px 16px;min-width:200px;}
.leaflet-popup-tip{background:var(--surface2);}
.leaflet-popup-close-button{color:var(--text-mid) !important;font-size:18px !important;padding:8px !important;}
.popup-venue{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;}
.popup-city{font-size:11px;color:var(--text-mid);margin-bottom:10px;}
.popup-team{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;color:var(--text-mid);}
.popup-team.visited{color:var(--text);}
.popup-team .sport-emoji{font-size:13px;}
.popup-team .check{color:#22c55e;font-weight:700;}
.popup-footer{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-mid);}
.popup-btn{margin-top:8px;width:100%;padding:6px;background:var(--surface);border:1px solid var(--border);color:var(--text-mid);border-radius:5px;cursor:pointer;font-size:11px;font-family:inherit;font-weight:600;transition:all .15s;}
.popup-btn:hover{border-color:var(--text-mid);color:var(--text);}

@media(max-width:900px){
  .main{grid-template-columns:1fr;}.sidebar{display:none;}
  .stats-strip{grid-template-columns:repeat(2,1fr);}
  .header,.controls,.search-wrap,.venue-table-wrap{padding-left:16px;padding-right:16px;}
  .stats-strip{margin:14px 16px;}
  .main{margin:0 16px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🏟️</div>
    <div>
      <div class="logo-text">Stadium Tracker</div>
      <div class="logo-sub">North American Pro Sports</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-sm" onclick="exportData()">Export</button>
    <button class="btn-sm danger" onclick="resetAll()">Reset All</button>
  </div>
</div>

<div class="stats-strip">
  <div class="stat-card">
    <div class="stat-num" id="stat-venues">0<span id="stat-venues-total">/0</span></div>
    <div class="stat-label">Venues Visited</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stat-cities">0</div>
    <div class="stat-label">Cities</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stat-sports">0<span>/4</span></div>
    <div class="stat-label">Sports</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="stat-teams-seen">0<span id="stat-teams-seen-total">/0</span></div>
    <div class="stat-label">Teams Seen</div>
    <div id="stat-seen-note" style="font-size:9px;color:var(--text-dim);margin-top:3px;letter-spacing:.04em"></div>
  </div>
</div>

<div class="controls">
  <button class="filter-btn active" data-sport="NBA" onclick="toggleSport('NBA',this)">🏀 NBA</button>
  <button class="filter-btn active" data-sport="NFL" onclick="toggleSport('NFL',this)">🏈 NFL</button>
  <button class="filter-btn active" data-sport="NHL" onclick="toggleSport('NHL',this)">🏒 NHL</button>
  <button class="filter-btn active" data-sport="MLB" onclick="toggleSport('MLB',this)">⚾ MLB</button>
  <div class="filter-sep"></div>
  <button class="toggle-visited" id="btn-visited" onclick="toggleVisitedOnly()">Visited Only</button>
  <button class="btn-fit" onclick="fitVisited()">Fit Map</button>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" type="text" id="search-input" placeholder="Search team or venue..." oninput="handleSearch(this.value)" onblur="closeSearchDelay()">
  <div class="search-results" id="search-results"></div>
</div>

<div class="main">
  <div id="map"></div>
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">My Progress</div>
      <div id="progress-bars"></div>
    </div>
    <div class="sidebar-section" style="flex:1">
      <div class="sidebar-title">Select Teams</div>
      <div id="team-list"></div>
    </div>
  </div>
</div>

<div class="venue-table-wrap" id="venue-table-wrap" style="display:none">
  <div class="venue-table-title">Visited Venues</div>
  <table class="venue-table">
    <thead><tr>
      <th>Venue</th><th>City</th><th>Sport</th><th>Team</th><th>Seen</th>
    </tr></thead>
    <tbody id="venue-tbody"></tbody>
  </table>
</div>

// ═══════════════════════════════════════════════════
// SPORT CONFIG
// ═══════════════════════════════════════════════════
const SPORT_CONFIG = {
  NBA:{color:'#f97316',emoji:'🏀',label:'NBA'},
  NFL:{color:'#3b82f6',emoji:'🏈',label:'NFL'},
  NHL:{color:'#ef4444',emoji:'🏒',label:'NHL'},
  MLB:{color:'#22c55e',emoji:'⚾',label:'MLB'},
};

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let visitedTeams = new Set(JSON.parse(localStorage.getItem('stadium_visited')||'[]'));
let seenTeams    = new Set(JSON.parse(localStorage.getItem('stadium_seen')||'[]'));
// Legacy migration: if old key exists, treat as visited
(()=>{const old=localStorage.getItem('stadium_selected');if(old){JSON.parse(old).forEach(t=>visitedTeams.add(t));localStorage.removeItem('stadium_selected');}})();
let activeSports = new Set(['NBA','NFL','NHL','MLB']);
let visitedOnly = false;
let markers = {}; // venue_id -> leaflet marker

// ═══════════════════════════════════════════════════
// MAP INIT
// ═══════════════════════════════════════════════════
const map = L.map('map',{center:[39.5,-97],zoom:4,zoomControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO',maxZoom:19
}).addTo(map);

// ═══════════════════════════════════════════════════
// MARKER CREATION
// ═══════════════════════════════════════════════════
function getVenueState(venue) {
  const relevantTeams = venue.teams.filter(t => activeSports.has(t.sport));
  const visitedHere   = relevantTeams.filter(t => visitedTeams.has(t.team));
  const seenHere      = relevantTeams.filter(t => seenTeams.has(t.team));
  return { relevantTeams, visitedHere, seenHere, isVisited: visitedHere.length > 0, hasRelevant: relevantTeams.length > 0 };
}

function makeMarkerIcon(venue, state) {
  if (!state.hasRelevant) {
    return L.divIcon({className:'',html:`<div style="width:8px;height:8px;border-radius:50%;background:#2e3350;border:1px solid #4a4f6a;"></div>`,iconSize:[8,8],iconAnchor:[4,4]});
  }
  if (!state.isVisited) {
    const sports = [...new Set(state.relevantTeams.map(t=>t.sport))];
    const col = sports.length === 1 ? SPORT_CONFIG[sports[0]].color+'33' : '#4a4f6a';
    const border = sports.length === 1 ? SPORT_CONFIG[sports[0]].color+'66' : '#6a7090';
    return L.divIcon({className:'',html:`<div style="width:10px;height:10px;border-radius:50%;background:${col};border:1.5px solid ${border};"></div>`,iconSize:[10,10],iconAnchor:[5,5]});
  }
  // Visited — marker driven by visited status only
  const sports = [...new Set(state.visitedHere.map(t=>t.sport))];
  const col = sports.length === 1 ? SPORT_CONFIG[sports[0]].color : '#a78bfa';
  const emoji = sports.length === 1 ? SPORT_CONFIG[sports[0]].emoji : '🏟️';
  return L.divIcon({
    className:'',
    html:`<div style="background:${col};color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 0 12px ${col}88;border:2px solid white;">${emoji}</div>`,
    iconSize:[28,28],iconAnchor:[14,14]
  });
}

function makePopup(venue) {
  const state = getVenueState(venue);
  const teamsToShow = venue.teams.filter(t=>activeSports.has(t.sport));
  const visitedCount = teamsToShow.filter(t=>visitedTeams.has(t.team)).length;

  let teamsHtml = teamsToShow.map(t=>{
    const vis = visitedTeams.has(t.team);
    const seen = seenTeams.has(t.team);
    const cfg = SPORT_CONFIG[t.sport];
    return `<div class="popup-team ${vis?'visited':''}" style="flex-direction:column;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
        <span class="sport-emoji">${cfg.emoji}</span>
        <span style="font-weight:600;font-size:12px;color:var(--text)">${t.team}</span>
      </div>
      <div style="display:flex;gap:10px;padding-left:2px;">
        <span style="font-size:11px;color:${vis?'#6366f1':'var(--text-dim)'}">🏟️ ${vis?'Visited ✓':'Not visited'}</span>
        <span style="font-size:11px;color:${seen?'#f59e0b':'var(--text-dim)'}">👀 ${seen?'Seen ✓':'Not seen'}</span>
      </div>
    </div>`;
  }).join('');
  if(!teamsToShow.length) teamsHtml = '<div style="font-size:11px;color:var(--text-dim)">No teams for active sports</div>';

  const footer = teamsToShow.length > 0
    ? `<div class="popup-footer" style="margin-top:6px">🏟️ ${visitedCount}/${teamsToShow.length} team${teamsToShow.length>1?'s':''} visited</div>` : '';

  return `<div>
    <div class="popup-venue">${venue.venue}</div>
    <div class="popup-city">${venue.city}${venue.state?', '+venue.state:''} · ${venue.country}</div>
    <div style="margin:8px 0">${teamsHtml}</div>
    ${footer}
  </div>`;
}

function toggleVisited(team, e) {
  e.stopPropagation();
  if(visitedTeams.has(team)) visitedTeams.delete(team);
  else visitedTeams.add(team);
  save(); renderAll();
}
function toggleSeenAway(team, e) {
  e.stopPropagation();
  // Only toggle seenTeams — if already in visitedTeams, seen is implied, so toggle visited off first
  if(visitedTeams.has(team)){
    // Clicking seen-away when already visited: remove from visited, keep in seenTeams
    visitedTeams.delete(team);
    seenTeams.add(team);
  } else if(seenTeams.has(team)){
    seenTeams.delete(team);
  } else {
    seenTeams.add(team);
  }
  save(); renderAll();
}

function renderMarkers() {
  // Clear existing markers
  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers = {};

  const seen = new Set();
  VENUES.forEach(venue=>{
    if(seen.has(venue.venue_id))return;
    seen.add(venue.venue_id);
    const state = getVenueState(venue);
    if(visitedOnly && !state.isVisited)return;
    const icon = makeMarkerIcon(venue, state);
    const m = L.marker([venue.lat,venue.lng],{icon}).addTo(map);
    m.bindPopup(makePopup(venue),{maxWidth:260});
    markers[venue.venue_id] = m;
  });
}

// ═══════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════
function updateStats() {
  const visitedVenueIds = new Set();
  const cities = new Set();
  const sportsWithVisited = new Set();
  const uniqueVenues = [...new Map(VENUES.map(v=>[v.venue_id,v])).values()];
  const allTeams = [...new Set(VENUES.flatMap(v=>v.teams.filter(t=>activeSports.has(t.sport)).map(t=>t.team)))];

  uniqueVenues.forEach(venue=>{
    const relevant = venue.teams.filter(t=>activeSports.has(t.sport));
    const visHere  = relevant.filter(t=>visitedTeams.has(t.team));
    if(visHere.length>0){
      visitedVenueIds.add(venue.venue_id);
      cities.add(venue.city+','+venue.country);
      visHere.forEach(t=>sportsWithVisited.add(t.sport));
    }
  });

  const teamsSeenCount    = allTeams.filter(t=>seenTeams.has(t)||visitedTeams.has(t)).length;
  const seenNotVisited    = allTeams.filter(t=>seenTeams.has(t)&&!visitedTeams.has(t)).length;
  const totalVenues       = new Set(uniqueVenues.filter(v=>v.teams.some(t=>activeSports.has(t.sport))).map(v=>v.venue_id)).size;

  document.getElementById('stat-venues').innerHTML         = `${visitedVenueIds.size}<span>/${totalVenues}</span>`;
  document.getElementById('stat-cities').textContent       = cities.size;
  document.getElementById('stat-sports').innerHTML         = `${sportsWithVisited.size}<span>/4</span>`;
  document.getElementById('stat-teams-seen').innerHTML     = `${teamsSeenCount}<span>/${allTeams.length}</span>`;
  document.getElementById('stat-seen-note').textContent    = seenNotVisited>0?`${seenNotVisited} seen, venue not visited`:'';

  // Progress bars — double: visited + seen per sport
  const pb = document.getElementById('progress-bars');
  pb.innerHTML = Object.entries(SPORT_CONFIG).map(([sport,cfg])=>{
    const sportTeams  = [...new Set(VENUES.flatMap(v=>v.teams.filter(t=>t.sport===sport).map(t=>t.team)))];
    const total       = sportTeams.length;
    const visCount    = sportTeams.filter(t=>visitedTeams.has(t)).length;
    const seenCount   = sportTeams.filter(t=>seenTeams.has(t)||visitedTeams.has(t)).length;
    const visPct      = total>0?Math.round(visCount/total*100):0;
    const seenPct     = total>0?Math.round(seenCount/total*100):0;
    return `<div class="progress-sport">
      <div class="progress-label">
        <span class="progress-name" style="color:${cfg.color}">${cfg.emoji} ${sport}</span>
      </div>
      <div class="progress-sub-label" style="color:#6366f1">🏟️ Visited</div>
      <div class="progress-bar-row">
        <div class="progress-bar"><div class="progress-fill" style="width:${visPct}%;background:#6366f1"></div></div>
        <span class="pb-count">${visCount}/${total}</span>
      </div>
      <div class="progress-sub-label" style="color:#f59e0b">👀 Seen</div>
      <div class="progress-bar-row">
        <div class="progress-bar"><div class="progress-fill" style="width:${seenPct}%;background:#f59e0b"></div></div>
        <span class="pb-count">${seenCount}/${total}</span>
      </div>
    </div>`;
  }).join('');

  // Venue table (visited venues)
  const visitedVenueRows = [];
  uniqueVenues.forEach(venue=>{
    venue.teams.filter(t=>activeSports.has(t.sport)&&visitedTeams.has(t.team)).forEach(t=>{
      visitedVenueRows.push({venue:venue.venue,city:venue.city,country:venue.country,sport:t.sport,team:t.team});
    });
  });
  const tbody = document.getElementById('venue-tbody');
  const wrap  = document.getElementById('venue-table-wrap');
  if(visitedVenueRows.length>0){
    wrap.style.display='block';
    tbody.innerHTML = visitedVenueRows.sort((a,b)=>a.sport.localeCompare(b.sport)).map(r=>{
      const cfg = SPORT_CONFIG[r.sport];
      const seen = seenTeams.has(r.team)||visitedTeams.has(r.team);
      return `<tr>
        <td>${r.venue}</td>
        <td>${r.city}, ${r.country}</td>
        <td><span class="sport-badge" style="background:${cfg.color}22;color:${cfg.color}">${cfg.emoji} ${r.sport}</span></td>
        <td>${r.team}</td>
        <td style="font-size:11px;color:${seen?'#f59e0b':'var(--text-dim)'}">👀 ${seen?'✓':'—'}</td>
      </tr>`;
    }).join('');
  } else {
    wrap.style.display='none';
  }
}

// ═══════════════════════════════════════════════════
// TEAM LIST (sidebar)
// ═══════════════════════════════════════════════════
function buildTeamList() {
  const container = document.getElementById('team-list');
  const html = Object.entries(SPORT_CONFIG)
    .filter(([s])=>activeSports.has(s))
    .map(([sport,cfg])=>{
      const teams = [...new Set(VENUES.flatMap(v=>v.teams.filter(t=>t.sport===sport).map(t=>t.team)))].sort();
      const items = teams.map(team=>{
        const vis  = visitedTeams.has(team);
        const seen = seenTeams.has(team)||vis; // visited implies seen
        const ts   = team.replace(/'/g,"\\'");
        // status dot
        let dotClass = '';
        if(vis && (seenTeams.has(team)||vis)) dotClass='both';
        else if(!vis && seenTeams.has(team)) dotClass='seen-only';
        else if(vis && !seenTeams.has(team)) dotClass='visited-only';
        const anySelected = vis||seenTeams.has(team);
        return `<div class="team-item ${anySelected?'any-selected':''}">
          <div class="team-status-dot ${dotClass}"></div>
          <span class="team-name" title="${team}">${team}</span>
          <div class="team-checks">
            <div class="chk ${vis?'visited':''}" title="Stadium visited" onclick="toggleVisited('${ts}',event)">${vis?'🏟️':''}</div>
            <div class="chk ${!vis&&seenTeams.has(team)?'seen':''}" title="Seen away" onclick="toggleSeenAway('${ts}',event)">${!vis&&seenTeams.has(team)?'👀':''}</div>
          </div>
        </div>`;
      }).join('');
      return `<div class="sport-group">
        <div class="sport-group-header">
          <div class="sport-dot" style="background:${cfg.color}"></div>${cfg.emoji} ${sport}
        </div>
        <div class="team-list-header">
          <span class="tlh-name">Team</span>
          <div class="tlh-checks">
            <span class="tlh-label" title="Stadium visited" style="color:#6366f1">🏟️</span>
            <span class="tlh-label" title="Seen away" style="color:#f59e0b">👀</span>
          </div>
        </div>
        ${items}
      </div>`;
    }).join('');
  container.innerHTML = html;
}

// ═══════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════
function handleSearch(q) {
  const box = document.getElementById('search-results');
  if(!q.trim()){box.classList.remove('open');return;}
  const ql = q.toLowerCase();
  const uniqueVenues = [...new Map(VENUES.map(v=>[v.venue_id,v])).values()];
  const results = uniqueVenues.filter(v=>
    v.venue.toLowerCase().includes(ql)||
    v.city.toLowerCase().includes(ql)||
    v.teams.some(t=>t.team.toLowerCase().includes(ql))
  ).slice(0,8);
  if(!results.length){box.classList.remove('open');return;}
  box.innerHTML = results.map(v=>{
    const teamsHtml = v.teams.filter(t=>activeSports.has(t.sport)).map(t=>{
      const cfg=SPORT_CONFIG[t.sport];
      const vis=visitedTeams.has(t.team);
      const seen=seenTeams.has(t.team)||vis;
      return `<span class="sr-badge" style="background:${cfg.color}22;color:${cfg.color}">${cfg.emoji} ${t.team}${vis?' 🏟️':seen?' 👀':''}</span>`;
    }).join('');
    return `<div class="sr-item" onmousedown="selectSearchResult('${v.venue_id}')">
      <div class="sr-venue">📍 ${v.venue} — ${v.city}</div>
      <div class="sr-teams">${teamsHtml||'<span style="color:var(--text-dim);font-size:11px">No active sport teams</span>'}</div>
    </div>`;
  }).join('');
  box.classList.add('open');
}

function selectSearchResult(venue_id) {
  const venue = VENUES.find(v=>v.venue_id===venue_id);
  if(!venue)return;
  document.getElementById('search-results').classList.remove('open');
  document.getElementById('search-input').value='';
  map.setView([venue.lat,venue.lng],14);
  if(markers[venue_id]){
    setTimeout(()=>markers[venue_id].openPopup(),300);
  }
}

function closeSearchDelay(){setTimeout(()=>document.getElementById('search-results').classList.remove('open'),200);}

// ═══════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════
function toggleSport(sport, btn) {
  if(activeSports.has(sport)) activeSports.delete(sport);
  else activeSports.add(sport);
  btn.classList.toggle('active', activeSports.has(sport));
  renderAll();
}

function toggleVisitedOnly() {
  visitedOnly = !visitedOnly;
  document.getElementById('btn-visited').classList.toggle('active',visitedOnly);
  renderMarkers();
}

function fitVisited() {
  const pts = VENUES.filter(v=>v.teams.some(t=>visitedTeams.has(t.team)&&activeSports.has(t.sport))).map(v=>[v.lat,v.lng]);
  if(pts.length) map.fitBounds(pts,{padding:[40,40]});
}

function resetAll() {
  if(!confirm('Reset all your selections?'))return;
  visitedTeams.clear(); seenTeams.clear();
  save(); renderAll();
}

function exportData() {
  const uniqueVenues = [...new Map(VENUES.map(v=>[v.venue_id,v])).values()];
  const data = {
    exported: new Date().toISOString(),
    visited_teams: [...visitedTeams],
    seen_teams: [...seenTeams],
    venues: uniqueVenues
      .filter(v=>v.teams.some(t=>visitedTeams.has(t.team)||seenTeams.has(t.team)))
      .map(v=>({venue:v.venue,city:v.city,country:v.country,
        teams:v.teams.map(t=>({team:t.team,sport:t.sport,visited:visitedTeams.has(t.team),seen:seenTeams.has(t.team)||visitedTeams.has(t.team)}))}))
  };
  const a = document.createElement('a');
  a.href = 'data:text/json,' + encodeURIComponent(JSON.stringify(data,null,2));
  a.download = 'my_stadium_tracker.json';
  a.click();
}

// ═══════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════
function save() {
  localStorage.setItem('stadium_visited', JSON.stringify([...visitedTeams]));
  localStorage.setItem('stadium_seen',    JSON.stringify([...seenTeams]));
}

// ═══════════════════════════════════════════════════
// RENDER ALL
// ═══════════════════════════════════════════════════
function renderAll() {
  renderMarkers();
  updateStats();
  buildTeamList();
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
renderAll();
</script>
</body>
</html>
